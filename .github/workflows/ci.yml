name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build first: examples/ consume packages through their published `exports`,
      # so nothing under examples/ can typecheck until dist/*.d.ts exists.
      - name: Build
        run: bun run build

      # `bun run lint`/`format` auto-fix in place, which would let a violation
      # pass CI silently and never reach the repo. CI uses the check variants.
      - name: Lint
        run: bun run lint:check

      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:cov

      # test:cov deliberately covers only ./packages and ./scripts, and the docs
      # site needs its own bunfig preload (a DOM), so
      # its suite runs from its own workspace.
      - name: Test the documentation site
        run: bun run --filter '@dunx/docs' test

      # Every example is a bootstrap that rots the moment nobody runs it, so all of
      # them are kept alive here rather than only the full one. test:cov above
      # deliberately covers ./packages and ./scripts only - the examples need their
      # own bunfig preload (the compiler transform), so their suites run from their
      # own workspaces. An example whose backing service is absent (Redis, Postgres,
      # MySQL, S3) reports that it is skipping and still exits 0.
      - name: Test the examples
        run: bun run --filter '@dunx/example-*' test

      # `start` is a long-running service now, so it can never exit 0. `tour`
      # boots the same app, narrates every package and exits - which is the
      # end-to-end check that the whole DI graph builds and every part works.
      - name: Tour the full example
        run: bun run --filter '@dunx/example-full' tour

      # The one example with no HTTP: four containers, one per database
      # configuration. SQLite always runs; Postgres and MySQL report that they are
      # skipping. Separate from the suites above because it is the entrypoint a
      # reader actually runs.
      - name: Run the databases example
        run: bun run --filter '@dunx/example-databases' start

      # `create-app` composes an app from feature directories copied out of
      # examples/full, and generates the wiring around whichever were chosen. The
      # copies are covered by the steps above and by a byte-for-byte parity test;
      # the *generated* wiring is a different file per selection, so it is only
      # covered by scaffolding and typechecking one. Every feature alone, the whole
      # set, and the combinations with something to get wrong.
      - name: Typecheck every scaffolded feature selection
        run: bun run check:scaffolds

      - name: Configure git identity
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Runs on every push to main and publishes on almost none of them: the script
      # self-skips unless HEAD is a `release:` commit. Publishing used to be a side
      # effect of merging, which shipped 33 versions in six days. The bump now covers
      # every commit back to the last release, which is why `fetch-depth: 0` above is
      # load-bearing - a shallow checkout cannot see the previous release marker and
      # would under-report the bump.
      #
      # Authenticated by npm trusted publishing (OIDC) via the id-token permission
      # above - no NPM_TOKEN. Each package needs a trusted publisher configured on
      # npmjs.com pointing at this repo and at this workflow **filename**; renaming
      # ci.yml silently breaks publishing for every package. version.ts runs the npm
      # CLI through `bunx npm@<pinned>`, so there is no Node/npm setup step here.
      #
      # Live as of 0.1.0, which was published by hand because a package with no
      # versions on npm has no trusted-publisher settings page to configure yet.
      # Every release from here is this step.
      - name: Release (on a `release:` commit)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: bun run version
        env:
          FORCE_PUBLISH: ${{ contains(github.event.head_commit.message, '[force-publish]') }}
          # Needed by `scripts/github-release.ts` to create the GitHub release.
          # Actions does not put this in the environment on its own, and 2.1.0 is
          # what proved it: the tag appeared and the release did not. The tag push
          # falls back to the credential `actions/checkout` persists, so that half
          # worked and hid the other half.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Husky's pre-push hook refuses any push oxfmt would change, and what gets
          # pushed here is this script's own generated commit. CI already ran
          # format:check over the source, so the hook can only produce a false
          # negative - which it did on 2.2.0, blocking a release that had already
          # reached npm and leaving main a version behind the registry.
          HUSKY: '0'

      # After the release, not before it. `bun run build` already built the site
      # once, before the coverage model and the badges existed; the release step
      # then writes the CHANGELOG.md the Releases page is generated from. Built
      # ahead of it, the deployed artifact carried neither - and the release
      # commit is `[skip ci]`, so nothing would rebuild until the next push.
      - name: Build the documentation site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: bun run docs:build

      - name: Upload the documentation site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./internal/docs/dist

  # Separate job so the `github-pages` environment (and any branch protection on it)
  # never gates the CI job itself - PR runs must not need it.
  pages:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy the documentation site to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
