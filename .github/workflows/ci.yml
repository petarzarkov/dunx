name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A PR run is superseded by its own next push. `main` is never cancelled: a run
# there can reach the release step.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every gate is a phase of `scripts/ci.ts`, invoked as `bun run ci <phase>`, so
# `bun run ci` locally runs exactly what these jobs run. `scripts/ci.test.ts`
# fails if a phase stops being wired here, or if a job reaches a gate directly.
#
# The four check jobs are independent and share only the build, which each one
# does for itself: `dist/` is 2 MB and rebuilding it costs less wall clock than
# a job that uploads it and three that wait to download it.
jobs:
  static:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: bun run ci build

      - name: Static checks
        run: bun run ci static

  unit:
    name: Packages, tools and scripts
    runs-on: ubuntu-latest
    # No services here on purpose. The suites that need one skip without it, and
    # `coverage` runs the same files with every service attached. Declaring them
    # twice is what broke the release job: it ran the gate with none.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: bun run ci build

      - name: Tests
        run: bun run ci unit

  examples:
    name: Examples, tour and scaffolds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: bun run ci build

      # Every example is a bootstrap that rots the moment nobody runs it. An
      # example whose backing service is absent (Redis, Postgres, MySQL, S3)
      # reports that it is skipping and still exits 0.
      - name: Examples
        run: bun run ci examples

  browser:
    name: Site in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: bun run ci build

      # No browser download step: `Bun.WebView` drives the Chrome the runner image
      # already ships. If that ever stops being true the constructor throws naming
      # what it looked for, rather than failing silently.
      - name: Browser suite
        run: bun run ci browser

      # `if: always()` because the failing run is the one worth looking at: each
      # test writes its frame before it asserts, so an overflow or a route that
      # loaded the wrong page leaves the picture behind. 28 PNGs, 7.8 MB.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: internal/docs/.shots
          # `.shots` is dot-prefixed, and the default is to skip hidden paths, so
          # the upload found nothing and failed a job whose suite had passed.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # `@dunx/infra`'s suites gate on whether their backing service answers and skip
    # when it does not, so CI ran neither: 49 tests skipped here against 5 on a
    # machine with valkey up, which put `infra` at 84.6% lines against the 90.7% the
    # floor was set from. The gate was reading a different denominator than the
    # machine that set it.
    #
    # Postgres covers `db/connection.ts` and `db/sql/connection.ts`, which had no
    # test run anywhere: `drizzle-orm/bun-sql` is a sanctioned integration and
    # `DUNX_DB_TEST_URL` was set in no environment. Adding a live-service suite means
    # adding its service here, or the floor measures less than it looks like.
    env:
      DUNX_DB_TEST_URL: postgres://dunx:dunx@localhost:5432/dunx
      DUNX_S3_TEST_BUCKET: dunx-test
      DUNX_S3_TEST_ENDPOINT: http://localhost:9000
      # Read by `Bun.S3Client` for any client that sets none. `S3_ENDPOINT` is
      # deliberately *not* set: the offline presign suite asserts on AWS hosts, and
      # exporting that turned two of its tests into assertions about MinIO.
      AWS_ACCESS_KEY_ID: dunxtest
      AWS_SECRET_ACCESS_KEY: dunxtestsecret
      AWS_REGION: us-east-1
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dunx
          POSTGRES_PASSWORD: dunx
          POSTGRES_DB: dunx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dunx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # MinIO cannot be a `services:` container: it needs `server /data` as its
      # command and a service block has no way to pass one. `files/s3.ts` was 35.1%
      # lines with nothing exercising `Bun.S3Client` at all; the round-trip against
      # a real bucket takes it to 87.8%.
      - name: Start MinIO and create the bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=dunxtest -e MINIO_ROOT_PASSWORD=dunxtestsecret \
            minio/minio server /data
          for _ in $(seq 1 40); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live >/dev/null
          docker run --rm --network host \
            -e MC_HOST_local=http://dunxtest:dunxtestsecret@localhost:9000 \
            minio/mc mb --ignore-existing local/dunx-test

      - name: Build
        run: bun run ci build

      # Sequential on purpose: `--coverage --parallel` reports a lower figure and
      # a different one each run (docs/bun-apis.md). The step writes a per-package
      # table into the job summary and fails any workspace under 90% on lines or
      # on functions.
      - name: Coverage
        run: bun run ci coverage

      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      # The model the site renders and the badges the README links, both generated
      # and gitignored. Published here so the release job can take them rather than
      # regenerate them: regenerating meant a second full test run *and* a second
      # copy of the service containers the gate needs, which is exactly what broke
      # the first release run on main.
      - name: Upload the coverage model and badges
        uses: actions/upload-artifact@v4
        with:
          name: coverage-model
          path: |
            internal/docs/src/generated/coverage.json
            internal/docs/public/badges
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: bun run ci build

      - name: Documentation site suite
        run: bun run ci docs

  # Runs on every push to main and publishes on almost none of them: the script
  # self-skips unless HEAD is a `release:` commit. Publishing used to be a side
  # effect of merging, which shipped 33 versions in six days. The bump covers
  # every commit back to the last release, which is why `fetch-depth: 0` is
  # load bearing here: a shallow checkout cannot see the previous release marker
  # and would under-report the bump. The four check jobs above take the default
  # shallow checkout, because nothing they run reads history.
  #
  # Authenticated by npm trusted publishing (OIDC) via the id-token permission
  # below, no NPM_TOKEN. Each package needs a trusted publisher configured on
  # npmjs.com pointing at this repo and at this workflow **filename**; renaming
  # ci.yml silently breaks publishing for every package. version.ts runs the npm
  # CLI through `bunx npm@<pinned>`, so there is no Node/npm setup step here.
  #
  # Live as of 0.1.0, which was published by hand because a package with no
  # versions on npm has no trusted-publisher settings page to configure yet.
  release:
    name: Release and build the site
    needs: [static, unit, examples, browser, coverage, docs]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Build
        run: bun run ci build

      # Taken from the `coverage` job, not regenerated. Regenerating ran the whole
      # suite again, and the gate it ends in needs the valkey and postgres services
      # that job declares: without them 49 tests skip, `infra` reads 85.8% against
      # its 92.6%, and this step fails on a release that nothing was wrong with.
      # One place declares the services, one job runs the gate.
      #
      # After the build, whose docs `generate` writes an empty model when it finds
      # none and leaves a real one alone, and before `docs:build`, which is what
      # copies `public/badges` into the deployed site.
      - name: Download the coverage model and badges
        uses: actions/download-artifact@v4
        with:
          name: coverage-model
          path: internal/docs

      # Loud rather than subtle. The upload roots the archive at the least common
      # ancestor of its paths, so a third path added above `internal/docs` would
      # silently land these somewhere else and the site would deploy an empty
      # coverage page with no badges.
      - name: Check the model and badges landed
        run: |
          test -f internal/docs/src/generated/coverage.json
          test -d internal/docs/public/badges
          echo "coverage model $(wc -c < internal/docs/src/generated/coverage.json) bytes, $(ls internal/docs/public/badges | wc -l) badges"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release (on a `release:` commit)
        run: bun run version
        env:
          FORCE_PUBLISH: ${{ contains(github.event.head_commit.message, '[force-publish]') }}
          # Needed by `scripts/github-release.ts` to create the GitHub release.
          # Actions does not put this in the environment on its own, and 2.1.0 is
          # what proved it: the tag appeared and the release did not. The tag push
          # falls back to the credential `actions/checkout` persists, so that half
          # worked and hid the other half.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Husky's pre-push hook refuses any push oxfmt would change, and what gets
          # pushed here is this script's own generated commit. CI already ran
          # format:check over the source, so the hook can only produce a false
          # negative, which it did on 2.2.0: it blocked a release that had already
          # reached npm and left main a version behind the registry.
          HUSKY: '0'

      # After the release, not before it. The release step writes the
      # CHANGELOG.md the Releases page is generated from, and the release commit
      # is `[skip ci]`, so nothing would rebuild until the next push.
      - name: Build the documentation site
        run: bun run docs:build

      - name: Upload the documentation site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./internal/docs/dist

  # Separate job so the `github-pages` environment (and any branch protection on
  # it) never gates a check job. PR runs must not need it.
  pages:
    name: Deploy the site
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy the documentation site to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
