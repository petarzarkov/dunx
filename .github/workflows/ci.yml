name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build first: examples/ consume packages through their published `exports`,
      # so nothing under examples/ can typecheck until dist/*.d.ts exists.
      - name: Build
        run: bun run build

      # `bun run lint`/`format` auto-fix in place, which would let a violation
      # pass CI silently and never reach the repo. CI uses the check variants.
      - name: Lint
        run: bun run lint:check

      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:cov

      # test:cov deliberately covers only ./packages and ./scripts, and the docs
      # site needs its own bunfig preload (a DOM), so
      # its suite runs from its own workspace.
      - name: Test the documentation site
        run: bun run --filter '@dunx/docs' test

      # Every example is a bootstrap that rots the moment nobody runs it, so all of
      # them are kept alive here rather than only the full one. test:cov above
      # deliberately covers ./packages and ./scripts only — the examples need their
      # own bunfig preload (the compiler transform), so their suites run from their
      # own workspaces. An example whose backing service is absent (Redis, Postgres,
      # MySQL, S3) reports that it is skipping and still exits 0.
      - name: Test the examples
        run: bun run --filter '@dunx/example-*' test

      # `start` is a long-running service now, so it can never exit 0. `tour`
      # boots the same app, narrates every package and exits — which is the
      # end-to-end check that the whole DI graph builds and every part works.
      - name: Tour the full example
        run: bun run --filter '@dunx/example-full' tour

      # The one example with no HTTP: four containers, one per database
      # configuration. SQLite always runs; Postgres and MySQL report that they are
      # skipping. Separate from the suites above because it is the entrypoint a
      # reader actually runs.
      - name: Run the databases example
        run: bun run --filter '@dunx/example-databases' start

      # `bun run build` already built the site once, before the coverage model
      # and badges existed. Rebuild so the deployed artifact carries them.
      - name: Build the documentation site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: bun run docs:build

      - name: Upload the documentation site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./tools/docs/dist

      - name: Configure git identity
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Authenticated by npm trusted publishing (OIDC) via the id-token permission
      # above — no NPM_TOKEN. Each package needs a trusted publisher on npmjs.com
      # pointing at this repo and this workflow file. version.ts runs the npm CLI
      # through `bunx npm@<pinned>`, so there is no Node/npm setup step to keep here.
      # UNCOMMENT when READY
      # - name: Version bump & publish
      #   if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      #   run: bun run version
      #   env:
      #     FORCE_PUBLISH: ${{ contains(github.event.head_commit.message, '[force-publish]') }}

  # Separate job so the `github-pages` environment (and any branch protection on it)
  # never gates the CI job itself — PR runs must not need it.
  pages:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy the documentation site to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
