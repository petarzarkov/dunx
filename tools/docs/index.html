<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The full-colour cut, because a tab strip's background is not something
         the page controls and `currentColor` would resolve against it. -->
    <link rel="icon" type="image/svg+xml" href="/logo/logo-mark-color.svg" />
    <title>dunx - a Bun-native DI framework</title>
    <meta
      name="description"
      content="Documentation and API reference for dunx, a Bun-native dependency injection framework."
    />
    <!-- Mantine's `ColorSchemeScript`, inlined. `MantineProvider` sets
         `data-mantine-color-scheme` on mount, which is after the first paint, so
         without this the page renders light for a frame and then flips - and the
         attribute is what every `[data-mantine-color-scheme='dark']` rule keys
         off. It has to be a real `<script>` in the head rather than the React
         component: by the time the tree renders, the paint being fixed has
         happened. Keep `auto` and the storage key in step with main.tsx. -->
    <script data-mantine-script>
      try {
        var stored = window.localStorage.getItem('mantine-color-scheme-value');
        var scheme =
          stored === 'light' || stored === 'dark' || stored === 'auto'
            ? stored
            : 'auto';
        document.documentElement.setAttribute(
          'data-mantine-color-scheme',
          scheme !== 'auto'
            ? scheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light',
        );
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
